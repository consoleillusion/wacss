name: Form
type: object
description: ""
additionalProperties: false
required: [id,block,schema]
properties:
  id:
    type: string
    description: Specify an id attribute for the component
    default: null
  block:
    type: boolean
    description: Whether this is a block component or not
    default: true
  tags:
    type: "array"
    items: {type: "string"}
    description: "Holds information about this component type"
    default: ["block","form","input"]
  fields:
    type: 'array'
    description: An array of JsonSchema Documents
    default: []
