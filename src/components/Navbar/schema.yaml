title: Navbar
#$id: "./schema.yaml"
type: object
description: A Navigation Bar for a website
additionalProperties: false
required: ["component","block"]
properties:
  component:
    type: string
    default: Navbar
    description: This specifies which component and schema is being used. It's mostly for internal purposes.
    x-group: Navbar
    "x-ui:hidden": true
  block:
    type: boolean
    description: Whether this is a block component or not
    default: true
    x-group: Navbar
    "x-ui:hidden": true
  tags:
    type: "array"
    items: {type: "string"}
    description: "Holds information about this component type"
    default: ["block","navbar","navigation"]
  links:
    type: array
    items:
      type: 'object'
      properties:
        href:
          type: "string"
        text: 
          type: "string"
    default: []
    x-group: Navbar
