title: Badge
type: object
description: A small badge/pill component for labels, tags, and status indicators.
additionalProperties: false
required: ["text", "component", "block"]
properties:
  component:
    type: string
    default: Badge
    description: This specifies which component and schema is being used. It's mostly for internal purposes.
  block:
    type: boolean
    description: Whether this is a block component or not
    default: false
  tags:
    type: "array"
    items: {type: "string"}
    description: "Holds information about this component type"
    default: ["inline","badge","data display"]
  text:
    type: string
    default: Badge
    description: The text content of the badge.
  variant:
    type: string
    default: primary
    enum:
      - primary
      - secondary
      - success
      - warning
      - error
      - info
    description: The color variant of the badge.
  size:
    type: string
    default: md
    enum:
      - sm
      - md
      - lg
    description: The size of the badge.
  icon:
    type: string
    default: ""
    description: Optional Iconify icon identifier to display before the text.
