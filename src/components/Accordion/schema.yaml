title: Accordion
#$id: "./schema.yaml"
type: object
description: "https://blog.hubspot.com/website/accordion-design"
additionalProperties: false
required: ["component","block"]
properties:
  component:
    type: "string"
    default: "Accordion"
    description: "This specifies which component and schema is being used. It's mostly for internal purposes."
  block:
    type: "boolean"
    description: "Whether this is a block component or not"
    default: false
  tags:
    type: "array"
    items: {type: "string"}
    description: "Holds information about this component type"
    default: ["inline","accordion","progressive disclosure"]
  id:
    type: "string"
    default: ""
  name:
    type: "string"
    default: ""
    description: "A name given to an accordion. It links the accordion items so that only one is open at one time. The end user doesnt see the name. Generally it should be set to something to give this accordion behavior, but it will be set to a random string if it is not supplied."
    x-generator: "randomId"
  items:
    type: "array"
    summary:
      type: string
      default: ""
      description: "The title content. Use Safe Markdown."
    details:
      type: string
      default: ""
      description: "The main content. Use MDX."
